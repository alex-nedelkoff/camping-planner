{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="auth-card">
  <h1>Camping Planner</h1>
  <p>Enter your email and we'll send you a magic sign-in link.</p>
  {% if request.query_params.get('error') %}<p class="error">That link didn't work — try again.</p>{% endif %}
  <form method="post" action="/login">
    <input type="email" name="email" placeholder="you@example.com" required autofocus>
    <button type="submit" class="btn">Send magic link</button>
  </form>
</div>
{% endblock %}
