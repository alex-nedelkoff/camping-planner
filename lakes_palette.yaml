# HSV thresholds for Jeff's lake water color. Tune empirically against
# the actual KMZ on first run; defaults are starting points.
hue:        [85, 110]
saturation: [40, 200]
value:      [180, 255]

# Minimum contour area in pixels (drops label boxes, decorative water symbols)
min_area_px: 500

# Optional: union a "paths" mask into the water mask. Jeff's draws yellow
# canoe-route lines on top of water bodies; without this union the route
# graphics split single lakes into multiple polygons. The yellow lines ARE
# semantically on water, so OR'ing them in restores the unified lake shape.
# Set `paths_yellow.enabled: false` (or omit the section entirely) to skip.
paths_yellow:
  enabled: true
  hue:        [22, 38]      # yellow-orange band
  saturation: [120, 255]
  value:      [180, 255]
  # Morphological open to drop isolated yellow blobs (text labels, trail
  # icons on land). Width in px of the kernel — set 0 to disable.
  open_kernel_px: 3
  # Restrict yellow to pixels within this many pixels of existing blue
  # water. Yellow drawn across land (Jeff's portage indications) gets
  # dropped; yellow drawn on a lake (canoe-route within a water body) is
  # kept. Set 0 to disable proximity filter (NOT recommended — without
  # it, yellow paths can bridge land between lakes into one blob).
  proximity_dilate_px: 6
