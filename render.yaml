services:
  - type: web
    name: camping-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-runtime.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: STORAGE_BACKEND
        value: postgres
      - key: AUTH_ENABLED
        value: "true"
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.7"
      # Postgres connection (Supabase IPv4 session pooler — Render free has no IPv6).
      - key: DATABASE_URL
        sync: false
      # Shared site password everyone logs in with.
      - key: SITE_PASSWORD
        sync: false
      # Secret for signing the username session cookie.
      - key: SESSION_SECRET
        generateValue: true
