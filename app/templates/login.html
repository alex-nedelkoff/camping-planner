{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block body %}
<div class="auth-card">
  <h1>Camping Planner</h1>
  <p>Enter your name and the shared site password.</p>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <input type="text" name="username" placeholder="Your name" required autofocus
           autocomplete="username">
    <input type="password" name="password" placeholder="Site password" required
           autocomplete="current-password">
    <button type="submit" class="btn">Log in</button>
  </form>
</div>
{% endblock %}
