{% extends "base.html" %}
{% block title %}Camping Trips{% endblock %}
{% block head_extra %}
<link rel="stylesheet" href="/static/css/trip.css">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" defer></script>
<script src="/static/js/trip.js" defer></script>
<script src="/static/js/meal-plan.js" defer></script>
<link rel="stylesheet" href="/static/css/foods.css">
<script src="/static/js/foods.js" defer></script>
<link rel="stylesheet" href="/static/css/gear.css">
<script src="/static/js/gear.js" defer></script>
<script src="/static/js/gear-plan.js" defer></script>
{% endblock %}
{% block body %}
<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-header">
      <h1>🏕 Trips</h1>
      <button id="user-pill" class="user-pill unset" onclick="App.switchUser()" title="Click to set / change name">…</button>
    </div>
    <nav class="sidebar-nav">
      <button class="nav-btn" data-route="/">Home</button>
      <button class="nav-btn" data-route="/new">+ New Trip</button>
      <button class="nav-btn" data-route="/availability">Check Availability</button>
      <button class="nav-btn" data-route="/foods">Foods DB</button>
      <button class="nav-btn" data-route="/gear">Gear DB</button>
    </nav>
    <div class="sidebar-section-label">Upcoming</div>
    <ul id="trips-upcoming" class="trip-list"></ul>
    <div class="sidebar-section-label">Past</div>
    <ul id="trips-past" class="trip-list"></ul>
    <div class="sidebar-section-label" id="broken-label" hidden>Broken</div>
    <ul id="trips-broken" class="trip-list"></ul>
  </aside>

  <main class="main-pane" id="main-pane">
    <div class="main-loading">Loading…</div>
  </main>
</div>

<template id="tpl-home">
  <section class="welcome">
    <h2>Camping Planner</h2>
    <p>Pick a trip from the sidebar, or start a new one.</p>
    <p class="muted">Tip: clicking different trips swaps the main pane without reloading — handy for comparing gear, dates, and costs across trips.</p>
  </section>
</template>

<template id="tpl-new">
  <section>
    <h2>New Trip</h2>
    <form id="new-trip-form">
      <label>Park
        <select name="park" required>
          <option value="">— select —</option>
          {% for slug, name in park_options %}
          <option value="{{ slug }}">{{ name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Start date <input type="date" name="start" required></label>
      <label>End date <input type="date" name="end" required></label>
      <label>Participants (comma separated)
        <input type="text" name="participants" placeholder="Alex, Jordan">
      </label>
      <button type="submit" class="btn">Create</button>
      <span class="status" data-status></span>
    </form>
  </section>
</template>

<template id="tpl-availability">
  <section>
    <h2>Check Park Availability</h2>
    <p class="warn">⚠ Ontario Parks rate-limits aggressively (Azure WAF will ban your IP for 30+ min after ~15 rapid requests). One check at a time, please.</p>
    <form id="avail-form">
      <label>Park
        <select name="park" required>
          <option value="">— select —</option>
          {% for slug, name in park_options %}
          <option value="{{ slug }}">{{ name }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Start <input type="date" name="start" required></label>
      <label>End <input type="date" name="end" required></label>
      <button type="submit" class="btn">Check</button>
    </form>
    <div data-results></div>
  </section>
</template>

<template id="tpl-foods">
  <section class="foods-page">
    <header class="foods-header">
      <h2>Foods</h2>
      <div class="foods-toolbar">
        <input type="search" id="foods-search" placeholder="Search foods…">
        <select id="foods-category-filter">
          <option value="">All categories</option>
        </select>
        <button id="foods-add" class="btn">+ Add food</button>
      </div>
    </header>
    <div class="foods-body">
      <ul id="foods-list" class="foods-list"></ul>
      <div id="foods-detail" class="foods-detail"></div>
    </div>
  </section>
</template>
<template id="tpl-gear">
  <section class="gear-page">
    <header class="gear-header">
      <h2>Gear</h2>
      <div class="gear-toolbar">
        <input type="search" id="gear-search" placeholder="Search gear…">
        <select id="gear-category-filter">
          <option value="">All categories</option>
        </select>
        <button id="gear-manage-cats" class="btn secondary">Manage categories…</button>
        <button id="gear-add" class="btn">+ Add item</button>
      </div>
    </header>
    <div class="gear-body">
      <ul id="gear-list" class="gear-list"></ul>
      <div id="gear-detail" class="gear-detail"></div>
    </div>
  </section>
</template>
{% endblock %}

{% block scripts %}
<script src="/static/js/index.js"></script>
{% endblock %}
