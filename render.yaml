services:
  - type: web
    name: camping-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements-runtime.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: STORAGE_BACKEND
        value: postgres
      - key: AUTH_ENABLED
        value: "true"
      - key: COOKIE_SECURE
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
