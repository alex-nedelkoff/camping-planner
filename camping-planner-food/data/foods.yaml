# Raw-ingredient library. One entry per ingredient.
#
# Schema (matches nutrition labels — enter what's on the back of the package):
#   id: kebab-case-unique
#   name: human label
#   category: protein|grain|dairy|nut|fruit|veg|fat|sauce|sweet|bar|snack|drink|prepared|spice
#   serving:
#     g:        serving size in grams (e.g. 68 for a Clif bar, 100 for raw oats)
#     kcal:     calories per serving
#     protein_g, carbs_g, fat_g: macros per serving
#   serving_label: optional human label (e.g. "1 bar", "1 pouch", "1 tbsp")
#   tags: list (optional)
#   notes: freeform
#
# kcal-per-100g is derived by the script and shown in `list foods` for
# comparison. Don't store it.
#
# How meals reference foods:
#   - { food: <id>, g: 60 }       → 60 grams (script scales serving block)
#   - { food: <id>, servings: 2 } → 2 × this food's serving block
#
# Add entries anywhere — order doesn't matter, script keys by id.

